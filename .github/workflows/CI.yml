name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; only the test job below gets more, for the cache pruning
# and the Codecov upload.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write     # julia-actions/cache prunes old caches
      contents: read
      id-token: write    # Codecov upload via OIDC, no token secret
    strategy:
      fail-fast: false
      matrix:
        version: ['1.6', '1', 'pre']
        os: [ubuntu-latest]
        arch: [x64]
        include:
          - {os: windows-latest, arch: x64, version: '1'}
          - {os: macOS-latest, arch: aarch64, version: '1'}
          - {os: ubuntu-latest, arch: x86, version: '1'}    # 32-bit Int
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2.1.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        env:
          JULIA_NUM_THREADS: 2     # so that test/tasks.jl reads one stream from two threads
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false

  # The tests against the oldest versions the compat entries allow, weak dependencies
  # included, on Julia 1.9: the first with package extensions, and the oldest the
  # resolver runs on. The matrix above tests only the newest versions.
  downgrade:
    name: Lowest compat versions - Julia 1.9
    # Julia 1.9's libopenlibm asks for an executable stack, which the C library of the
    # current ubuntu-latest refuses ("cannot enable executable stack"); 22.04's allows it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: '1.9'
      - uses: julia-actions/julia-downgrade-compat@30b83cf94e89744fcbd7ea5496be4967d6fbe540 # v2.7.0
        with:
          mode: alldeps
          julia_version: '1.9'
          projects: ., test      # the test dependencies live in test/Project.toml
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        with:
          allow_reresolve: false
          force_latest_compatible_version: false

  crosscheck:
    name: Cross-check against lecroyutils (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: '1'
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2.1.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install numpy lecroyutils==4.0.2
      - run: julia --project=. test/crosscheck/write.jl "$RUNNER_TEMP/trc"
      - run: python test/crosscheck/read.py "$RUNNER_TEMP/trc"
