name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

# Read-only by default; only the TagBot job below can write.
permissions:
  contents: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    # The same scopes as before, moved down to the job. TagBot writes only to
    # contents; it reads issues and pull requests for the changelog.
    permissions:
      actions: read
      checks: read
      contents: write   # creating the tag and the release
      deployments: read
      issues: read
      discussions: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: read
      statuses: read
    steps:
      - uses: JuliaRegistries/TagBot@87cc4cc2b4639f6c743f5772f376a32914060732 # v1.25.15
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
